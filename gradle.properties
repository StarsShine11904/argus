# JVM settings - keep these aligned with Loom 1.17.20 / MC 26.3 expectations.
org.gradle.jvmargs=-Xmx2G
org.gradle.parallel=true
# Loom still has known issues with the configuration cache; leave disabled.
org.gradle.configuration-cache=false

# Java release target. The Argus source code is written to be source-compatible
# with Java 21+. Mojang 26.3 requires Java 25+ at runtime, and the dev
# environment now has a 25 JDK, so we pin to 25. The `compatibilityLevel` in
# mixin configs follows this number.
java_release=25

# === Identity ===
# Mod ID for the produced jar (`fabric.mod.json.id`, `assets/argus/`, mixin package, logger).
mod_id=argus

# === Versions ===
minecraft_version=26.3
loader_version=0.19.3
loom_version=1.17.20
fabric_api_version=0.160.5+26.3
neo_version=26.3.0.4-beta
minecraft_version_range=[26.3]
sodium_fabric_version=0.9.2+mc26.3
sodium_neoforge_version=0.9.2+mc26.3
sodium_version_range=[0.9.0,)

mod_version=0.9.1
maven_group=com.argus
