name: Build Artifacts

on:
  workflow_dispatch:
  push:
    branches:
      - master

jobs:
  build:
    name: Build
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Read Minecraft version
        run: |
          echo "MINECRAFT_VERSION=$(sed -n 's/^minecraft_version=//p' gradle.properties)" >> "$GITHUB_ENV"

      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew

      - name: Build Fabric jar
        run: ./gradlew :src:fabric:build -x test

      - name: Build NeoForge jar
        run: ./gradlew :src:neoforge:build -x test

      - name: Collect loader artifacts
        run: |
          mkdir -p build/release-artifacts
          cp src/fabric/build/libs/argus-fabric-*.jar build/release-artifacts/
          cp src/neoforge/build/libs/argus-neoforge-*.jar build/release-artifacts/
          ls -la build/release-artifacts

      - name: Upload loader artifacts
        uses: actions/upload-artifact@v4
        with:
          name: argus-loader-jars-mc${{ env.MINECRAFT_VERSION }}-${{ github.sha }}
          path: build/release-artifacts/*.jar
          if-no-files-found: error